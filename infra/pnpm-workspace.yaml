# pnpm settings for the infra package (single package, not a real workspace).

# pnpm doesn't run dependency build scripts unless allowed here. Two are Jest 30 internals, and
# esbuild (CDK's Lambda bundler, PETRO-8); all three ship prebuilt native binaries as optional
# dependencies, so their install scripts are only a fallback or a check, and they stay off (as in
# nakostat and katooni).
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  unrs-resolver: false

# Refuse versions published in the last 24 h, a defence against freshly compromised releases.
minimumReleaseAge: 1440
